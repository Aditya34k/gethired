[project]
name = "gethired"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pymupdf>=1.24.0",
    "qdrant-client>=1.9.1",
    "litellm>=1.40.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "supabase>=2.4.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "sentence-transformers>=3.0.0",    # add this line
    "langgraph>=0.2.28",               # add this too — also installed manually
    "pyyaml>=6.0.0",                   # needed for knowledge base YAML files
    "requests>=2.31.0",                # needed for test files
]

[tool.setuptools.packages.find]
where = ["services"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"