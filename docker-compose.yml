services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
    restart: unless-stopped
    volumes:
      - ./services:/app/services
      - ./knowledge_base:/app/knowledge_base

  qdrant:
    image: qdrant/qdrant:v1.9.2
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: