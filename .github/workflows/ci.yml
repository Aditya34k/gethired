name: CI

# Trigger on every push and pull request to main branch
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      # Step 1 — check out your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"    # cache pip downloads — speeds up future runs

      # Step 3 — install dependencies
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Step 4 — run linter
      # ruff checks for common Python mistakes and import ordering
      - name: Lint with ruff
        run: ruff check services/

      # Step 5 — run tests
      # Only runs unit tests — not integration tests that need Qdrant/Groq
      - name: Run tests
        run: pytest tests/ -v --ignore=tests/test_interview.py --ignore=tests/test_prep.py --ignore=tests/test_retriever.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          API_KEY: test-key

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test    # only runs if test job passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatically provided by GitHub

      # Build and push the Docker image
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gethired:latest
            ghcr.io/${{ github.repository_owner }}/gethired:${{ github.sha }}